version: "3.8"

services:
  dynamo:
    image: amazon/dynamodb-local:latest
    container_name: stalkexchange_dynamo
    ports:
      - "8002:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    networks:
      - app-net

  dynamo-admin:
    image: node:20-alpine
    container_name: stalkexchange_dynamo_admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamo:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    command: sh -c "npm install -g dynamodb-admin --quiet && dynamodb-admin"
    depends_on:
      - dynamo
    networks:
      - app-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stalkexchange_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DYNAMO_ENDPOINT: http://dynamo:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  frontend:
    build:
      context: ./stalkExchange
      dockerfile: Dockerfile
    container_name: stalkexchange_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
